name: research-brief-studio
version: 0.1.0
kind: studio
description: Creates a source-aware research brief through observable steps.
inputs:
  - name: question
    type: string
    required: true
    sensitive: false
steps:
  - id: collect
    label: Collect sources
    depends_on: []
    review: false
  - id: synthesize
    label: Synthesize findings
    depends_on: [collect]
    review: false
  - id: review
    label: Review uncertainty and citations
    depends_on: [synthesize]
    review: true
permissions:
  network: read
  write_output: user-confirmed
  execute_code: false
outputs:
  - id: research-brief
    type: application/json
    portable: true
    retention: user-controlled
