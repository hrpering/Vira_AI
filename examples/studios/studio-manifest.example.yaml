name: research-brief-studio
version: 0.1.0
kind: studio
description: Creates a source-aware research brief through observable steps.
inputs:
  - name: question
    type: string
    required: true
steps:
  - id: collect
    label: Collect sources
  - id: synthesize
    label: Synthesize findings
  - id: review
    label: Review uncertainty and citations
permissions:
  network: read
  write_output: user-confirmed
outputs:
  - type: research-brief
    portable: true
