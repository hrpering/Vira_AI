version: 0.1
name: balanced-turkish-writing
task:
  language: tr
  class: structured-writing
constraints:
  max_latency_ms: 8000
  require_citations: false
  allowed_regions: [eu]
preferences:
  - criterion: latency
    weight: 0.35
  - criterion: quality
    weight: 0.65
candidates:
  - id: account-available-model
    capabilities: [chat, structured-writing]
    availability: account-reported
    reason: "Selected only when the live Vira account catalog reports it available."
fallbacks:
  - id: account-available-model
    when: [timeout, capacity, transient-error]
disclosure:
  show_selected_model: true
  show_fallback: true
  show_reason: true
